[workspace]
resolver = "3"
members = ["crates/iiko-api", "crates/iiko-office"]

[workspace.package]
version = "0.10.3"
edition = "2024"
repository = "https://github.com/KirillkoTankisto/iiko-office"
license = "GPL-2.0-or-later"

[workspace.dependencies]
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[profile.release]
strip = true
lto = true
codegen-units = 1
